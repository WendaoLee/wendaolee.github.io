name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main  # 当推送到 main 分支时触发

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Move CNAME file
        run: cp CNAME ./out/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out  # 静态导出文件夹路径
          force_orphan: true  # 确保 gh-pages 分支不会出现冲突

      - name: Sleep 30s
        run: sleep 30

      - name: IndexNow Submit
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: https://leewendao.otterstack.cn/sitemap.xml
          since: 1
          since-unit: month
          key: ${{ secrets.INDEXNOW_KEY }}
